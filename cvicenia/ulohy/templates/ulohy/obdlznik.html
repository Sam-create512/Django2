<h1>Obdlznik</h1>
<form method="post">
    {% csrf_token %}
    <label for="dlzka">Strana a:</label>
    <input type="number" step="any" name="dlzka" id="dlzka" required>
    <br>
    <label for="sirka">Strana b:</label>
    <input type="number" step="any" name="sirka" id="sirka" required>
    <br>
    <button type="submit">Vypočítať</button>
</form>

{% if obsah is not None %}
    <p>Obsah obdlznika: {{ obsah }}</p>
{% endif %}
{% if obvod is not None %}
    <p>Obvod obdlznika: {{ obvod }}</p>
{% endif %}
