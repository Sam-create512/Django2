<h1>Kalkulacka</h1>
<form method="post">
    {% csrf_token %}
    <input type="number" name="cislo1" required>
    <select name="operacia" required>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" name="cislo2" required>
    <button type="submit">Vypočítať</button>
</form>

{% if vysledok is not None %}
    <p>Výsledok: {{ vysledok }}</p>
{% endif %}
