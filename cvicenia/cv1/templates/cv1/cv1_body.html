<form method="post">
    {% csrf_token %}
    <label for="body">Body:</label>
    <input type="number" step="any" name="body" id="body" required>
    <br>
    <label for="max">Max bodov:</label>
    <input type="number" step="any" name="max" id="max" required>
    <br>
    <button type="submit">Vypočítať</button>
</form>

{% if vysledok is not None and vysledok != "Chyba" %}
    <p>{{ body }} z {{ max_bodov }} bodov = {{ percenta|floatformat:2 }}% -> známka {{ vysledok }}</p>
{% elif vysledok == "Chyba" %}
    <p>Chyba: Neplatné vstupné údaje</p>
{% endif %}
